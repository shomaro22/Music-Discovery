name: Production Deploy Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deploy-verification
  cancel-in-progress: false

jobs:
  verify:
    if: ${{ vars.PRODUCTION_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Validate production configuration
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.PRODUCTION_FRONTEND_BASE_URL }}
        run: |
          test -n "$API_BASE_URL" || {
            echo "PRODUCTION_API_BASE_URL is not configured."
            exit 1
          }
          test -n "$FRONTEND_BASE_URL" || {
            echo "PRODUCTION_FRONTEND_BASE_URL is not configured."
            exit 1
          }

      # Render and Vercel deploy automatically from the main branch.
      # This workflow verifies the deployed services instead of building/pushing unused GHCR images.
      - name: Wait for Render health
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          for i in {1..36}; do
            if curl --fail --silent --show-error "$API_BASE_URL/health" >/dev/null; then
              echo "Render health check passed."
              exit 0
            fi
            echo "Waiting for Render deployment... ($i/36)"
            sleep 10
          done
          echo "Render health check did not become healthy in time."
          exit 1

      - name: Verify Render readiness
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: curl --fail --show-error --retry 6 --retry-delay 5 "$API_BASE_URL/ready"

      - name: Wait for Vercel frontend
        env:
          FRONTEND_BASE_URL: ${{ vars.PRODUCTION_FRONTEND_BASE_URL }}
        run: |
          for i in {1..36}; do
            if curl --fail --silent --show-error "$FRONTEND_BASE_URL/" >/dev/null; then
              echo "Vercel frontend check passed."
              exit 0
            fi
            echo "Waiting for Vercel deployment... ($i/36)"
            sleep 10
          done
          echo "Vercel frontend did not become available in time."
          exit 1

      - name: Verify Vercel SPA route
        env:
          FRONTEND_BASE_URL: ${{ vars.PRODUCTION_FRONTEND_BASE_URL }}
        run: curl --fail --show-error --retry 6 --retry-delay 5 "$FRONTEND_BASE_URL/login"

      - name: Production smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/k6/smoke.js
        env:
          BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
