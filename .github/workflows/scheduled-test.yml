name: Scheduled Test

on:
  schedule:
    - cron: "41 18 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_discovery_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d music_discovery_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_discovery_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
      - run: go test -race ./...

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run lint:any
      - run: npm test
      - run: npm run build
