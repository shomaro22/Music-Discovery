name: Backend CI

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/integration-test.yml"
      - "docker-compose.ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
      - ".github/workflows/integration-test.yml"
      - "docker-compose.ci.yml"

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache-dependency-path: backend/go.sum

      - name: Download dependencies
        run: go mod download

      - name: Verify go.mod / go.sum are tidy
        run: |
          cp go.mod /tmp/go.mod.before
          cp go.sum /tmp/go.sum.before
          go mod tidy
          cmp -s go.mod /tmp/go.mod.before
          cmp -s go.sum /tmp/go.sum.before

      - name: Check format
        run: |
          files="$(gofmt -l .)"
          if [ -n "$files" ]; then
            echo "The following files are not gofmt formatted:"
            echo "$files"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Unit tests with race detector and coverage
        env:
          CI: "false"
        run: go test -race -coverprofile=coverage.out ./...

      - name: Build backend
        run: |
          mkdir -p ../artifacts
          go build -trimpath -o ../artifacts/music-discovery-api .

      - name: Upload backend artifact
        uses: actions/upload-artifact@v6
        with:
          name: backend-binary
          path: artifacts/music-discovery-api
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage
        uses: actions/upload-artifact@v6
        with:
          name: backend-coverage
          path: backend/coverage.out
          if-no-files-found: error
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: backend-runtime
          push: false
          tags: music-discovery-api:ci
