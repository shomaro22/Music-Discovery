name: Production Rollback

on:
  workflow_dispatch:
    inputs:
      render_deploy_id:
        description: "Render deploy ID to roll back the backend to"
        required: true
      vercel_deployment_url:
        description: "Previous Vercel production deployment URL"
        required: true
      reason:
        description: "Rollback reason"
        required: true

permissions:
  contents: read

concurrency:
  group: production-rollback
  cancel-in-progress: false

jobs:
  rollback:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate rollback configuration
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.PRODUCTION_FRONTEND_BASE_URL }}
        run: |
          test -n "$RENDER_API_TOKEN" || { echo "RENDER_API_TOKEN is not configured."; exit 1; }
          test -n "$RENDER_SERVICE_ID" || { echo "RENDER_SERVICE_ID is not configured."; exit 1; }
          test -n "$VERCEL_TOKEN" || { echo "VERCEL_TOKEN is not configured."; exit 1; }
          test -n "$API_BASE_URL" || { echo "PRODUCTION_API_BASE_URL is not configured."; exit 1; }
          test -n "$FRONTEND_BASE_URL" || { echo "PRODUCTION_FRONTEND_BASE_URL is not configured."; exit 1; }

      - name: Record rollback request
        env:
          REASON: ${{ inputs.reason }}
          RENDER_DEPLOY_ID: ${{ inputs.render_deploy_id }}
          VERCEL_DEPLOYMENT_URL: ${{ inputs.vercel_deployment_url }}
        run: |
          echo "Rollback reason: $REASON"
          echo "Render target deploy: $RENDER_DEPLOY_ID"
          echo "Vercel target deployment: $VERCEL_DEPLOYMENT_URL"

      - name: Roll back Render backend
        env:
          RENDER_API_TOKEN: ${{ secrets.RENDER_API_TOKEN }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          RENDER_DEPLOY_ID: ${{ inputs.render_deploy_id }}
        run: |
          python3 - <<'PY' > /tmp/render-rollback.json
          import json, os
          print(json.dumps({"deployId": os.environ["RENDER_DEPLOY_ID"]}))
          PY
          curl --fail-with-body --show-error --retry 3 \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/rollback" \
            -H "Authorization: Bearer ${RENDER_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/render-rollback.json

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Roll back Vercel frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_DEPLOYMENT_URL: ${{ inputs.vercel_deployment_url }}
        run: vercel rollback "$VERCEL_DEPLOYMENT_URL" --token "$VERCEL_TOKEN" --timeout 180s

      - name: Wait for backend after rollback
        env:
          API_BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
        run: |
          for i in {1..36}; do
            if curl --fail --silent --show-error "$API_BASE_URL/ready" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Verify frontend after rollback
        env:
          FRONTEND_BASE_URL: ${{ vars.PRODUCTION_FRONTEND_BASE_URL }}
        run: curl --fail --show-error --retry 12 --retry-delay 5 "$FRONTEND_BASE_URL/login"

      - name: Smoke test after rollback
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/k6/smoke.js
        env:
          BASE_URL: ${{ vars.PRODUCTION_API_BASE_URL }}
