name: Staging Deploy Verification

on:
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-deploy-verification
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ vars.STAGING_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: staging
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Validate staging configuration
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
          FRONTEND_BASE_URL: ${{ vars.STAGING_FRONTEND_BASE_URL }}
        run: |
          test -n "$API_BASE_URL" || {
            echo "STAGING_API_BASE_URL is not configured."
            exit 1
          }
          test -n "$FRONTEND_BASE_URL" || {
            echo "STAGING_FRONTEND_BASE_URL is not configured."
            exit 1
          }

      # Enable this workflow only after a Render staging service and a stable Vercel staging URL exist.
      - name: Wait for staging API health
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: |
          for i in {1..36}; do
            if curl --fail --silent --show-error "$API_BASE_URL/health" >/dev/null; then
              echo "Staging API health check passed."
              exit 0
            fi
            echo "Waiting for staging API... ($i/36)"
            sleep 10
          done
          exit 1

      - name: Verify staging API readiness
        env:
          API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
        run: curl --fail --show-error --retry 6 --retry-delay 5 "$API_BASE_URL/ready"

      - name: Wait for staging frontend
        env:
          FRONTEND_BASE_URL: ${{ vars.STAGING_FRONTEND_BASE_URL }}
        run: |
          for i in {1..36}; do
            if curl --fail --silent --show-error "$FRONTEND_BASE_URL/" >/dev/null; then
              echo "Staging frontend check passed."
              exit 0
            fi
            echo "Waiting for staging frontend... ($i/36)"
            sleep 10
          done
          exit 1

      - name: Verify staging SPA route
        env:
          FRONTEND_BASE_URL: ${{ vars.STAGING_FRONTEND_BASE_URL }}
        run: curl --fail --show-error --retry 6 --retry-delay 5 "$FRONTEND_BASE_URL/login"

      - name: Staging smoke test
        uses: grafana/k6-action@v0.3.1
        with:
          filename: tests/k6/smoke.js
        env:
          BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
