name: Integration Test

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/integration-test.yml"
      - "docker-compose.ci.yml"
  push:
    branches: [develop, main]
    paths:
      - "backend/**"
      - ".github/workflows/integration-test.yml"
      - "docker-compose.ci.yml"

concurrency:
  group: integration-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: music_discovery_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d music_discovery_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      CI: "true"
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/music_discovery_test?sslmode=disable
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.11"
          cache-dependency-path: backend/go.sum
      - name: Download dependencies
        run: go mod download
      - name: Run PostgreSQL integration tests
        run: go test -p 1 -parallel 1 -count=1 -coverprofile=integration-coverage.out ./...
      - name: Verify test database is reachable after tests
        env:
          PGPASSWORD: postgres
        run: psql -h localhost -U postgres -d music_discovery_test -c 'SELECT current_database();'
      - name: Upload integration coverage
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: backend-integration-coverage
          path: backend/integration-coverage.out
          if-no-files-found: warn
          retention-days: 7
