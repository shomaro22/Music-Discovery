name: Security Scan

on:
  pull_request:
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  go-vulnerability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go dependencies and reachable code
        run: govulncheck ./...

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend runtime image from root Dockerfile
        run: docker build --target backend-runtime -t music-discovery-api:scan -f Dockerfile .
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: music-discovery-api:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
