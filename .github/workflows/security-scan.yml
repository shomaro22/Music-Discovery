name: Security Scan

on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "Dockerfile"
      - ".github/workflows/**"
  schedule:
    - cron: "17 18 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  security-events: write

jobs:
  go-vulnerability:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26.5"
          cache-dependency-path: backend/go.sum
      - name: Verify Go patch version
        run: |
          go version
          test "$(go env GOVERSION)" = "go1.26.5"
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Scan Go dependencies and reachable code
        run: govulncheck ./...

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=critical

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fetch pull request base branch
        if: github.event_name == 'pull_request'
        run: |
          git fetch --no-tags origin \
            "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Scan secrets introduced by this pull request
        if: github.event_name == 'pull_request'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect \
            --source=/repo \
            --log-opts="origin/${{ github.base_ref }}..HEAD" \
            --redact \
            --no-banner \
            --exit-code=1

      - name: Scan current repository tree for secrets
        if: github.event_name != 'pull_request'
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            dir /repo \
            --redact \
            --no-banner \
            --exit-code=1

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend runtime image from root Dockerfile
        run: docker build --target backend-runtime -t music-discovery-api:scan -f Dockerfile .
      - name: Scan backend runtime image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: music-discovery-api:scan
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
      - name: Scan repository filesystem
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL
          exit-code: "1"
          ignore-unfixed: true
