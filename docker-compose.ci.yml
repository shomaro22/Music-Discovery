services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_discovery
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d music_discovery"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
      target: backend-runtime
    environment:
      APP_ENV: test
      APP_PORT: "8080"
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/music_discovery?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: test-jwt-secret-at-least-32-characters-long
      CORS_ALLOW_ORIGIN: http://localhost:5173
      SEED_DEVELOPMENT_USERS: "true"
      SEED_DEVELOPMENT_CATALOG: "true"
      LOG_LEVEL: info
      TEST_FIXED_NOW: "2026-08-08T12:00:00Z"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 30

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-development
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    depends_on:
      api:
        condition: service_healthy
